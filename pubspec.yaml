name: javhub_desktop
description: JavHub 的 Windows 原生客户端：片库、搜索下载、推荐、任务、想看，mpv 播放 + 115 本地代理 + 字幕悬浮球。
publish_to: none
version: 0.5.1+11

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: 1.0.12
  media_kit_libs_android_video: 1.3.8
  package_info_plus: ^10.2.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

# The same media_kit set moonfin-jav plays 115 streams with (checked smooth there).
dependency_overrides:
  # Fork of 1.0.12 with a newer libmpv (and PGS subtitles that render).
  media_kit_libs_windows_video:
    git:
      url: https://github.com/RadicalMuffinMan/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
      ref: 50013aee7429633ae2df656982167ca6d21237ce
  media_kit_video:
    git:
      url: https://github.com/RadicalMuffinMan/media-kit.git
      path: media_kit_video
      ref: 50013aee7429633ae2df656982167ca6d21237ce
  # objective_c 9.3.0's build hook breaks `flutter test` on Flutter 3.47.
  objective_c: ^9.4.1
  # 2.6.x of these generate FFI code that fails constant evaluation in the
  # Windows build on Flutter 3.47; the versions moonfin-jav builds with.
  shared_preferences_foundation: 2.5.7
  path_provider_foundation: 2.6.0

flutter:
  uses-material-design: true
