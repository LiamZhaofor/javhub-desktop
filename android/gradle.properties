# Kept small: this machine is short on memory. One Gradle JVM (1.5 GB heap) that exits
# when the build ends, Kotlin compiled inside it (no separate Kotlin daemon), 2 workers.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
